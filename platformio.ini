[platformio]
default_envs = freenove_oven

[env:freenove_oven]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; FNK0104B hardware: ESP32-S3R8 + 16 MB external flash.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

; USB CDC is the only debug console. UART0 pins are repurposed as the two
; thermocouple chip-select outputs, so do not attach a serial peripheral.
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D TOASTER_SENSOR_DIAGNOSTICS
  -D LV_CONF_SKIP
  -D USER_SETUP_LOADED
  ; TFT_eSPI 2.5.43 needs explicit SPI2 register mapping on ESP32-S3.
  -D USE_FSPI_PORT
  -D ILI9341_2_DRIVER
  ; Required by Freenove's FNK0104AB panel setup: correct black/white polarity.
  -D TFT_INVERSION_ON
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_RST=-1
  -D SPI_FREQUENCY=40000000
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_32=1
  -D LV_FONT_MONTSERRAT_48=1
  -D LV_COLOR_16_SWAP=0

lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  lvgl/lvgl @ 8.4.0

; Optional local-only animation asset; intentionally not distributed.
[env:freenove_oven_animation]
extends = env:freenove_oven
board_build.embed_files = assets/boot/history_hot_240x135_12_5fps.rgb565
build_flags =
  ${env:freenove_oven.build_flags}
  -D TOASTER_BOOT_ANIMATION
